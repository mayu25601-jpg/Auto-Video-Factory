<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* Fonts: system fallback — GitHub Actions has no Google Fonts access */

        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; }

        /* ═══════════════════════════════════════
           BACKGROUND
        ═══════════════════════════════════════ */
        .bg-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0; overflow: hidden;
        }
        .bg-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(40px) brightness(0.5); transform: scale(1.3);
            position: absolute; opacity: 0; transition: opacity 0.6s ease;
        }
        .bg-img.active { opacity: 1; }

        /* ═══════════════════════════════════════
           MAIN IMAGE
        ═══════════════════════════════════════ */
        .image-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; overflow: hidden;
        }
        .slide-img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; opacity: 0;
            transform: scale(1.1) rotate(0deg);
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.9));
        }

        .slide-img.active         { opacity: 1; }
        .slide-img.active.move-1  { animation: pan1    12s ease-out forwards; }
        .slide-img.active.move-2  { animation: pan2    12s ease-out forwards; }
        .slide-img.active.move-3  { animation: zoomIn  12s ease-out forwards; }
        .slide-img.active.move-4  { animation: zoomOut 12s ease-out forwards; }
        .slide-img.active.move-5  { animation: pan3    12s ease-out forwards; }

        @keyframes pan1    { 0%   { transform: scale(1.1) translateX(50px)  rotate(2deg);  }
                             100% { transform: scale(1.2) translateX(-30px) rotate(-1deg); } }
        @keyframes pan2    { 0%   { transform: scale(1.2) translateX(-50px) rotate(-2deg); }
                             100% { transform: scale(1.1) translateX(30px)  rotate(1deg);  } }
        @keyframes zoomIn  { 0%   { transform: scale(1.0) translateY(20px); }
                             100% { transform: scale(1.25) translateY(0px); } }
        @keyframes zoomOut { 0%   { transform: scale(1.3); }
                             100% { transform: scale(1.0); } }
        @keyframes pan3    { 0%   { transform: scale(1.2) translateY(-20px); }
                             100% { transform: scale(1.2) translateY(20px);  } }

        /* ═══════════════════════════════════════
           OVERLAYS
        ═══════════════════════════════════════ */
        .flash-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: white; z-index: 40;
            opacity: 0; pointer-events: none;
        }
        .flash-active { animation: flash 0.3s ease-out forwards; }
        @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        .grain-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20; pointer-events: none; opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .vignette {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: linear-gradient(to top,
                rgba(0,0,0,0.95) 10%, transparent 100%);
            z-index: 28;
        }

        .vignette-top {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 20%;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.5) 0%, transparent 100%);
            z-index: 28;
        }

        /* ═══════════════════════════════════════
           PROGRESS BAR
        ═══════════════════════════════════════ */
        .progress-bar-track {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.12); z-index: 60;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(to right, #0077cc, #00E5FF);
            box-shadow: 0 0 10px rgba(0,229,255,0.8);
            transition: width 0.1s linear;
        }

        /* ═══════════════════════════════════════
           SUBSCRIBE POPUP
        ═══════════════════════════════════════ */
        .social-popup {
            position: absolute; left: -400px; z-index: 50;
            display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.95);
            padding: 12px 25px; border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .social-popup.show { left: 30px; }

        .social-icon {
            width: 55px; height: 55px; fill: #FF0000;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0%   { transform: scale(1);    }
            50%  { transform: scale(1.15); }
            100% { transform: scale(1);    }
        }
        .social-text {
            font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
            font-weight: 900; color: #000;
            font-size: 26px; text-transform: uppercase;
        }

        body.fmt-16-9 .social-popup { bottom: 150px; }
        body.fmt-9-16 .social-popup {
            bottom: 500px; left: -500px; transform: scale(1.1);
        }
        body.fmt-9-16 .social-popup.show { left: 20px; }
        body.fmt-4-5  .social-popup { bottom: 250px; }

        /* ═══════════════════════════════════════
           CAPTIONS — Voyaxis Cyan #00E5FF
        ═══════════════════════════════════════ */
        .caption-wrapper {
            position: absolute;
            left: 50%; transform: translateX(-50%);
            width: 95%; z-index: 30;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .caption-accent-line {
            width: 60px; height: 3px;
            background: linear-gradient(to right, transparent, #00E5FF, transparent);
            margin-bottom: 10px; border-radius: 2px;
        }

        .caption-container {
            font-family: 'Liberation Sans Bold', 'DejaVu Sans Bold', Arial Black, sans-serif;
            font-weight: 900; text-transform: uppercase;
            display: flex; flex-wrap: wrap;
            justify-content: center; align-items: center;
            letter-spacing: 0.5px; line-height: 1.25;
            -webkit-text-stroke: 2px rgba(0,0,0,0.9);
            paint-order: stroke fill;
        }

        .word {
            margin: 0 5px;
            color: rgba(255,255,255,0.4);
            display: inline-block;
            transform-origin: center bottom;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ✨ VOYAXIS: Cyan #00E5FF */
        .word.active {
            color: #00E5FF !important;
            opacity: 1;
            transform: scale(1.2) translateY(-4px);
            text-shadow:
                4px 4px 0px #000,
                0 0 15px rgba(0,229,255,0.5);
        }

        .word.active.money {
            color: #00FF41 !important;
            text-shadow: 0 0 20px rgba(0,255,65,0.9), 4px 4px 0px rgba(0,0,0,0.9);
        }
        .word.active.danger {
            color: #FF0040 !important;
            text-shadow: 0 0 20px rgba(255,0,64,0.9), 4px 4px 0px rgba(0,0,0,0.9);
            animation: shakeWord 0.4s ease-in-out infinite;
        }
        .word.active.hype {
            color: #FFD700 !important;
            text-shadow: 0 0 20px rgba(255,215,0,0.9), 4px 4px 0px rgba(0,0,0,0.9);
            animation: bounceWord 0.6s infinite;
        }

        .emoji-addon {
            font-size: 0.8em; margin-left: 5px;
            opacity: 0; transform: scale(0);
            display: inline-block;
            transition: all 0.2s ease;
            -webkit-text-stroke: 0;
        }
        .word.active .emoji-addon { opacity: 1; transform: scale(1); }

        @keyframes shakeWord {
            0%, 100% { transform: scale(1.2) translateY(-4px) rotate(0deg);  }
            25%       { transform: scale(1.2) translateY(-4px) rotate(-5deg); }
            75%       { transform: scale(1.2) translateY(-4px) rotate(5deg);  }
        }
        @keyframes bounceWord {
            0%, 100% { transform: scale(1.2) translateY(-4px);  }
            50%       { transform: scale(1.25) translateY(-12px); }
        }

        /* Format sizes */
        body.fmt-16-9 .caption-wrapper   { bottom: 40px; }
        body.fmt-16-9 .caption-container { font-size: 60px; }

        body.fmt-9-16 .caption-wrapper   { bottom: 180px; }
        body.fmt-9-16 .caption-container { font-size: 65px; line-height: 1.1; }
        body.fmt-9-16 .caption-accent-line { width: 80px; }

        body.fmt-4-5  .caption-wrapper   { bottom: 50px; }
        body.fmt-4-5  .caption-container { font-size: 55px; }
    </style>
</head>
<body class="fmt-16-9">

    <div class="bg-layer"      id="bg-slider"></div>
    <div class="image-wrapper" id="slider"></div>
    <div class="flash-overlay" id="flashInfo"></div>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
    <div class="vignette-top"></div>

    <!-- Progress bar -->
    <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- Subscribe popup -->
    <div class="social-popup" id="socialBox">
        <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                     2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                     C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
                     c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <div><div class="social-text">Subscribe</div></div>
    </div>

    <!-- Captions -->
    <div class="caption-wrapper">
        <div class="caption-accent-line"></div>
        <div class="caption-container" id="captions"></div>
    </div>

    <script>
        let segmentsData = [];
        let videoDuration = 0;
        let socialShown   = false;

        const keywords = {
            money: {
                regex: /[\$£€¥₿]|^\d+[kKmMbB]?$/,
                cls: 'money', emoji: '💰',
            },
            danger: {
                regex: /(die|dead|kill|murder|secret|danger|fail|crash|blood|crime|warning|dark|shock|expose|scandal|arrest)/i,
                cls: 'danger', emoji: '⚠️',
            },
            hype: {
                regex: /(billion|million|massive|huge|biggest|greatest|insane|unbelievable|legendary|shocking|explosive|record)/i,
                cls: 'hype', emoji: '🔥',
            },
        };

        function triggerFlash() {
            const el = document.getElementById('flashInfo');
            el.classList.remove('flash-active');
            void el.offsetWidth;
            el.classList.add('flash-active');
        }

        function showSlide(index, moveIndex) {
            const moves    = ['move-1','move-2','move-3','move-4','move-5'];
            const slides   = document.querySelectorAll('.slide-img');
            const bgSlides = document.querySelectorAll('.bg-img');
            const allCls   = ['active', ...moves];

            slides.forEach(s => s.classList.remove(...allCls));
            if (slides[index]) {
                // KEY FIX: Use deterministic moveIndex from Python
                // No Math.random() — same result every screenshot
                const safeIdx = (typeof moveIndex === 'number') ? moveIndex % moves.length : 0;
                const m = moves[safeIdx];
                slides[index].classList.add('active', m);
                triggerFlash();
            }
            bgSlides.forEach(b => b.classList.remove('active'));
            if (bgSlides[index]) bgSlides[index].classList.add('active');
        }

        function loadCaptions(data) { segmentsData = data; }
        function setDuration(dur)   { videoDuration = dur; }

        function updateTime(currentTime) {

            // Progress bar
            if (videoDuration > 0) {
                const pct = (currentTime / videoDuration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
            }

            // Subscribe popup at 40%
            if (videoDuration > 0 && !socialShown &&
                currentTime > videoDuration * 0.40) {
                socialShown = true;
                const box = document.getElementById('socialBox');
                box.classList.add('show');
                setTimeout(() => box.classList.remove('show'), 5000);
            }

            // Captions
            const container = document.getElementById('captions');
            const activeSeg = segmentsData.find(
                s => currentTime >= s.start && currentTime <= s.end
            );

            if (activeSeg) {
                if (container.dataset.segId != activeSeg.id) {
                    container.innerHTML = '';
                    container.dataset.segId = activeSeg.id;

                    activeSeg.words.forEach(w => {
                        const span = document.createElement('span');
                        span.className     = 'word';
                        span.dataset.start = w.start;
                        span.dataset.end   = w.end;
                        span.appendChild(document.createTextNode(w.word));

                        for (const key in keywords) {
                            const kw = keywords[key];
                            if (kw.regex.test(w.word)) {
                                span.classList.add(kw.cls);
                                if (kw.emoji) {
                                    const em = document.createElement('span');
                                    em.className   = 'emoji-addon';
                                    em.textContent = kw.emoji;
                                    span.appendChild(em);
                                }
                                break;
                            }
                        }
                        container.appendChild(span);
                    });
                }

                container.querySelectorAll('.word').forEach(span => {
                    const s = parseFloat(span.dataset.start);
                    const e = parseFloat(span.dataset.end);
                    if (currentTime >= s && currentTime <= e + 0.2)
                        span.classList.add('active');
                    else
                        span.classList.remove('active');
                });

            } else {
                container.innerHTML     = '';
                container.dataset.segId = -1;
            }
        }
    </script>
</body>
</html>

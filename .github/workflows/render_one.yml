name: Render one folder

on:
  workflow_call:
    inputs:
      folder:
        required: true
        type: string
      format:
        required: true
        type: string
      branding:
        required: true
        type: string
      fps:
        required: true
        type: string
      quality:
        required: true
        type: string

# Send job ဖြုတ်ထားသည် — GitHub concurrency က pending send များကို ဖျက်သောကြောင့်
# Telegram ပို့ခြင်းကို parent workflow ရဲ့ send-as-ready job က လုပ်သည်။

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check folder exists
        id: check
        run: |
          FOLDER="videos/${{ inputs.folder }}"
          if [ ! -d "$FOLDER" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          has_mp3=$(find "$FOLDER" -maxdepth 1 -iname "*.mp3" 2>/dev/null | wc -l)
          has_img=$(find "$FOLDER" -maxdepth 1 \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            2>/dev/null | wc -l)
          if [[ $has_mp3 -eq 0 || $has_img -eq 0 ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python packages
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-v5
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Whisper model
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-v1

      - name: Cache Playwright browsers
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install Python packages
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install \
            "numpy<2.0.0" \
            "moviepy==1.0.3" \
            Pillow \
            openai-whisper \
            playwright
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Playwright and Chromium
        if: steps.check.outputs.skip != 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Install FFmpeg and Fonts
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg fonts-noto-core fonts-noto-color-emoji \
            fonts-sil-padauk fonts-liberation fontconfig
          fc-cache -f

      - name: Render Folder ${{ inputs.folder }}
        if: steps.check.outputs.skip != 'true'
        id: render
        env:
          FOLDER_NAME:          ${{ inputs.folder }}
          VIDEO_FORMAT:         ${{ inputs.format }}
          BRANDING_ALIAS:       ${{ inputs.branding }}
          FPS_INPUT:            ${{ inputs.fps }}
          QUALITY_INPUT:        ${{ inputs.quality }}
          SECRET_BRAND_A:       ${{ secrets.MY_BRAND_A }}
          SECRET_BRAND_A_TYPOS: ${{ secrets.MY_BRAND_A_TYPOS }}
          SECRET_BRAND_B:       ${{ secrets.MY_BRAND_B }}
          SECRET_BRAND_B_TYPOS: ${{ secrets.MY_BRAND_B_TYPOS }}
        run: |
          for attempt in 1 2; do
            echo "Attempt ${attempt}/2"
            if python scripts/render_single.py; then
              echo "render_status=success" >> $GITHUB_OUTPUT
              break
            else
              if [ $attempt -eq 2 ]; then
                echo "render_status=failed" >> $GITHUB_OUTPUT
                exit 1
              fi
              sleep 5
            fi
          done

      - name: Upload Video_${{ inputs.folder }}
        if: >
          steps.check.outputs.skip != 'true' &&
          steps.render.outputs.render_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Video_${{ inputs.folder }}
          path: output/${{ inputs.folder }}.mp4
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

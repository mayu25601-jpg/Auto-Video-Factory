name: Send Artifacts to Telegram

# ဒီနေ့ render ပြီးသားဖိုင်တွေကို rerender မလုပ်ဘဲ Telegram သို့ တစ်ဖိုင်ချင်းပို့ရန်
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Render run ID (Actions URL ထဲက ဂဏန်း)'
        required: true
        default: '35481590764'
      format:
        description: 'Caption format'
        required: true
        default: 'youtube'
      branding:
        description: 'Caption branding'
        required: true
        default: 'BRAND_A'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyrogram
        run: pip install pyrogram tgcrypto -q

      - name: Download artifacts from render run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: Video_*
          path: all-videos/
          merge-multiple: true

      - name: Send videos to Telegram one by one
        timeout-minutes: 360
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          FORMAT:            ${{ github.event.inputs.format }}
          BRANDING:          ${{ github.event.inputs.branding }}
        run: |
          set +e
          shopt -s nullglob
          files=(all-videos/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No mp4 files found. Check run_id and artifact expiry (1 day)."
            find all-videos -type f | head -50
            exit 1
          fi
          ok=0
          fail=0
          for f in "${files[@]}"; do
            name=$(basename "$f" .mp4)
            echo "======== Sending ${name}.mp4 ========"
            python scripts/telegram_send.py \
              "$f" \
              "$name" \
              "${FORMAT}" \
              "${BRANDING}" \
              "n/a"
            if [ $? -eq 0 ]; then
              ok=$((ok + 1))
              echo "OK: ${name}"
            else
              fail=$((fail + 1))
              echo "FAIL: ${name}"
            fi
            echo "Pause 15s before next file..."
            sleep 15
          done
          echo "Telegram send done. OK=${ok} FAIL=${fail}"
          if [ "$ok" -eq 0 ]; then
            exit 1
          fi
